<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="warningapplication_1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>warningapplication_1</title>
  <link rel="manifest" href="manifest.json">

  <!-- Bundled MapLibre GL assets; CDN entries below are fallback only. -->
  <link href='assets/lib/assets/maplibre/maplibre-gl.css' rel='stylesheet'/>
  <script src='assets/lib/assets/maplibre/maplibre-gl.js'></script>
  <script>
    (function() {
      var sources = [
        'https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js',
        'https://fastly.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js'
      ];
      var index = 0;
      function load() {
        if (typeof maplibregl !== 'undefined') return;
        var script = document.createElement('script');
        script.src = sources[index];
        script.onload = function() { console.log('MapLibre loaded: ' + script.src); };
        script.onerror = function() {
          index++;
          if (index < sources.length) load();
          else console.error('MapLibre failed from all CDN sources');
        };
        document.head.appendChild(script);
      }
      load();
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
